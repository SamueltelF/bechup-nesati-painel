<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Dev - Gerenciar Vendedores</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .header h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .password-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .password-section input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }

    .password-section button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    .password-section button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .stat-card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .stat-card .number {
      font-size: 36px;
      font-weight: bold;
      color: #667eea;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 30px;
      background: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .tab.active {
      background: #667eea;
      color: white;
    }

    .content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
    }

    .content.active {
      display: block;
    }

    .search-bar {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .user-list {
      display: grid;
      gap: 15px;
    }

    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border: 2px solid #f0f0f0;
      border-radius: 10px;
      transition: all 0.3s;
    }

    .user-card:hover {
      border-color: #667eea;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
    }

    .user-info {
      flex: 1;
    }

    .user-info h3 {
      font-size: 18px;
      color: #333;
      margin-bottom: 5px;
    }

    .user-info p {
      color: #666;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .user-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-promote {
      background: #10b981;
      color: white;
    }

    .btn-promote:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    .btn-demote {
      background: #f59e0b;
      color: white;
    }

    .btn-demote:hover {
      background: #d97706;
      transform: translateY(-2px);
    }

    .btn-delete {
      background: #ef4444;
      color: white;
    }

    .btn-delete:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    .btn-view {
      background: #667eea;
      color: white;
    }

    .btn-view:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }

    .badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-approved {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-content h2 {
      color: #667eea;
      margin-bottom: 20px;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .success {
      background: #d1fae5;
      color: #065f46;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .locked {
      opacity: 0.5;
      pointer-events: none;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 10px 20px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .pagination button:hover:not(:disabled) {
      background: #667eea;
      color: white;
    }

    .pagination button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filters select {
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔧 Painel de Desenvolvimento</h1>
      <p>Gerenciamento de Vendedores e Clientes</p>
      
      <div class="password-section" id="passwordSection">
        <label><strong>Senha de Desenvolvedor:</strong></label>
        <input type="password" id="devPassword" placeholder="Digite a senha de dev">
        <button onclick="unlockPanel()">Desbloquear Painel</button>
      </div>
    </div>

    <div id="mainPanel" class="locked">
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <h3>Total de Usuários</h3>
          <div class="number" id="totalUsers">0</div>
        </div>
        <div class="stat-card">
          <h3>Clientes</h3>
          <div class="number" id="totalCustomers">0</div>
        </div>
        <div class="stat-card">
          <h3>Vendedores</h3>
          <div class="number" id="totalSellers">0</div>
        </div>
        <div class="stat-card">
          <h3>Aprovados</h3>
          <div class="number" id="approvedSellers">0</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('customers')">Clientes</button>
        <button class="tab" onclick="switchTab('sellers')">Vendedores</button>
      </div>

      <div id="customersContent" class="content active">
        <h2>Lista de Clientes</h2>
        <input type="text" class="search-bar" id="searchCustomers" placeholder="Buscar por nome ou email...">
        <div id="customersList" class="user-list"></div>
        <div class="pagination" id="customersPagination"></div>
      </div>

      <div id="sellersContent" class="content">
        <h2>Lista de Vendedores</h2>
        <div class="filters">
          <select id="statusFilter" onchange="loadSellers()">
            <option value="">Todos os status</option>
            <option value="pending">Pendente</option>
            <option value="approved">Aprovado</option>
            <option value="rejected">Rejeitado</option>
          </select>
        </div>
        <input type="text" class="search-bar" id="searchSellers" placeholder="Buscar por nome ou loja...">
        <div id="sellersList" class="user-list"></div>
        <div class="pagination" id="sellersPagination"></div>
      </div>
    </div>
  </div>

  <!-- Modal Promover -->
  <div class="modal" id="promoteModal">
    <div class="modal-content">
      <h2>Promover para Vendedor</h2>
      <p id="promoteUserName"></p>
      <input type="text" id="storeName" placeholder="Nome da Loja">
      <input type="text" id="storeDescription" placeholder="Descrição da Loja">
      <div class="modal-actions">
        <button class="btn btn-promote" onclick="confirmPromote()">Confirmar</button>
        <button class="btn" style="background: #ccc;" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin + '/api/dev';
    let currentPassword = '';
    let currentUserId = null;
    let customersPage = 1;
    let sellersPage = 1;

    async function unlockPanel() {
      const password = document.getElementById('devPassword').value;
      if (!password) {
        alert('Digite a senha');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/stats`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ devPassword: password })
        });

        if (response.ok) {
          currentPassword = password;
          document.getElementById('passwordSection').style.display = 'none';
          document.getElementById('mainPanel').classList.remove('locked');
          loadStats();
          loadCustomers();
          showSuccess('Painel desbloqueado com sucesso!');
        } else {
          showError('Senha incorreta!');
        }
      } catch (error) {
        showError('Erro ao conectar com o servidor');
      }
    }

    async function loadStats() {
      try {
        const response = await fetch(`${API_URL}/stats`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ devPassword: currentPassword })
        });

        const data = await response.json();
        document.getElementById('totalUsers').textContent = data.users.total;
        document.getElementById('totalCustomers').textContent = data.users.customers;
        document.getElementById('totalSellers').textContent = data.sellers.total;
        document.getElementById('approvedSellers').textContent = data.sellers.approved;
      } catch (error) {
        console.error('Erro ao carregar stats:', error);
      }
    }

    async function loadCustomers(page = 1) {
      const search = document.getElementById('searchCustomers').value;
      customersPage = page;

      try {
        const response = await fetch(`${API_URL}/customers?page=${page}&limit=10&search=${search}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ devPassword: currentPassword })
        });

        const data = await response.json();
        renderCustomers(data.customers);
        renderPagination('customersPagination', data.pagination, loadCustomers);
      } catch (error) {
        showError('Erro ao carregar clientes');
      }
    }

    async function loadSellers(page = 1) {
      const search = document.getElementById('searchSellers').value;
      const status = document.getElementById('statusFilter').value;
      sellersPage = page;

      try {
        const response = await fetch(`${API_URL}/sellers?page=${page}&limit=10&search=${search}&status=${status}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ devPassword: currentPassword })
        });

        const data = await response.json();
        renderSellers(data.sellers);
        renderPagination('sellersPagination', data.pagination, loadSellers);
      } catch (error) {
        showError('Erro ao carregar vendedores');
      }
    }

    function renderCustomers(customers) {
      const list = document.getElementById('customersList');
      
      if (customers.length === 0) {
        list.innerHTML = '<div class="loading">Nenhum cliente encontrado</div>';
        return;
      }

      list.innerHTML = customers.map(customer => `
        <div class="user-card">
          <div class="user-info">
            <h3>${customer.name}</h3>
            <p>📧 ${customer.email}</p>
            <p>📱 ${customer.phone || 'Sem telefone'}</p>
            <p>📅 Cadastrado em: ${new Date(customer.createdAt).toLocaleDateString('pt-BR')}</p>
          </div>
          <div class="user-actions">
            ${!customer.hasAdminProfile ? 
              `<button class="btn btn-promote" onclick="openPromoteModal('${customer._id}', '${customer.name}')">
                Promover
              </button>` : 
              `<span class="badge badge-pending">Já é vendedor</span>`
            }
          </div>
        </div>
      `).join('');
    }

    function renderSellers(sellers) {
      const list = document.getElementById('sellersList');
      
      if (sellers.length === 0) {
        list.innerHTML = '<div class="loading">Nenhum vendedor encontrado</div>';
        return;
      }

      list.innerHTML = sellers.map(seller => {
        const statusBadge = {
          pending: 'badge-pending',
          approved: 'badge-approved',
          rejected: 'badge-rejected'
        }[seller.verificationStatus];

        return `
          <div class="user-card">
            <div class="user-info">
              <h3>${seller.storeName || 'Sem nome de loja'} <span class="badge ${statusBadge}">${seller.verificationStatus}</span></h3>
              <p>👤 ${seller.userId?.name || 'N/A'} - ${seller.userId?.email || 'N/A'}</p>
              <p>📦 Produtos: ${seller.totalProducts || 0} | 💰 Vendas: ${seller.totalSales || 0}</p>
              <p>⭐ Avaliação: ${seller.rating?.toFixed(1) || '0.0'} (${seller.totalReviews || 0} avaliações)</p>
              <p>📅 Criado em: ${new Date(seller.createdAt).toLocaleDateString('pt-BR')}</p>
            </div>
            <div class="user-actions">
              <button class="btn btn-demote" onclick="demoteSeller('${seller.userId._id}', '${seller.userId.name}')">
                Rebaixar
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPagination(elementId, pagination, loadFunction) {
      const container = document.getElementById(elementId);
      container.innerHTML = `
        <button ${!pagination.hasPrevPage ? 'disabled' : ''} onclick="${loadFunction.name}(${pagination.currentPage - 1})">
          ← Anterior
        </button>
        <span style="padding: 10px;">Página ${pagination.currentPage} de ${pagination.totalPages}</span>
        <button ${!pagination.hasNextPage ? 'disabled' : ''} onclick="${loadFunction.name}(${pagination.currentPage + 1})">
          Próxima →
        </button>
      `;
    }

    function openPromoteModal(userId, userName) {
      currentUserId = userId;
      document.getElementById('promoteUserName').textContent = `Promovendo: ${userName}`;
      document.getElementById('storeName').value = `Loja de ${userName}`;
      document.getElementById('promoteModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('promoteModal').classList.remove('active');
      currentUserId = null;
    }

    async function confirmPromote() {
      const storeName = document.getElementById('storeName').value;
      const storeDescription = document.getElementById('storeDescription').value;

      if (!storeName) {
        alert('Digite o nome da loja');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/promote/${currentUserId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            devPassword: currentPassword,
            storeName,
            storeDescription 
          })
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess('Usuário promovido com sucesso!');
          closeModal();
          loadStats();
          loadCustomers(customersPage);
        } else {
          showError(data.message);
        }
      } catch (error) {
        showError('Erro ao promover usuário');
      }
    }

    async function demoteSeller(userId, userName) {
      if (!confirm(`Tem certeza que deseja rebaixar "${userName}" para cliente?`)) {
        return;
      }

      try {
        const response = await fetch(`${API_URL}/demote/${userId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ devPassword: currentPassword })
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess('Vendedor rebaixado com sucesso!');
          loadStats();
          loadSellers(sellersPage);
        } else {
          showError(data.message);
        }
      } catch (error) {
        showError('Erro ao rebaixar vendedor');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

      if (tab === 'customers') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('customersContent').classList.add('active');
        loadCustomers();
      } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('sellersContent').classList.add('active');
        loadSellers();
      }
    }

    function showError(message) {
      const error = document.createElement('div');
      error.className = 'error';
      error.textContent = message;
      document.querySelector('.container').insertBefore(error, document.querySelector('.container').firstChild);
      setTimeout(() => error.remove(), 5000);
    }

    function showSuccess(message) {
      const success = document.createElement('div');
      success.className = 'success';
      success.textContent = message;
      document.querySelector('.container').insertBefore(success, document.querySelector('.container').firstChild);
      setTimeout(() => success.remove(), 5000);
    }

    // Busca em tempo real
    document.addEventListener('DOMContentLoaded', () => {
      let searchTimeout;
      document.getElementById('searchCustomers').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadCustomers(), 500);
      });

      document.getElementById('searchSellers').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadSellers(), 500);
      });
    });
  </script>
</body>
</html>
